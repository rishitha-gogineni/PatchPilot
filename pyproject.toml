[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchpilot"
version = "0.1.0"
description = "A safety-first foundation for an AI coding assistant."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Rishitha Gogineni" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm = ["openai>=1.0"]
# LangGraph 0.2 is the last compatible line for the project's Python 3.9 runtime.
graph = ["langgraph>=0.2.74,<0.3"]

[project.scripts]
patchpilot = "patchpilot.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
